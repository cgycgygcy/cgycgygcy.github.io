<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>IB Knowledge Base | Grade 9 (MYP) to DP | Mathematics &amp; Physics</title>
<style>
:root{
  --bg:#0d1220; --bg2:#111827; --panel:#172033; --panel2:#1c2740; --line:#293654;
  --txt:#e8eef9; --muted:#97a6c0; --dim:#6d7e9d; --accent:#6ea8fe; --accent2:#9b8cff;
  --ok:#4ade80; --warn:#fbbf24; --focus:#f472b6; --shadow:0 6px 26px rgba(0,0,0,.30);
}
html[data-theme="light"]{
  --bg:#f4f7fc; --bg2:#eaf0f8; --panel:#fff; --panel2:#f6f9fe; --line:#dbe3f0;
  --txt:#182236; --muted:#57677f; --dim:#8493a9; --accent:#2563eb; --accent2:#6d28d9;
  --ok:#15803d; --warn:#b45309; --focus:#be185d; --shadow:0 4px 18px rgba(22,40,80,.09);
}
body[data-board="physics"]{--accent:#2dd4bf;--accent2:#38bdf8}
html[data-theme="light"] body[data-board="physics"]{--accent:#0d9488;--accent2:#0284c7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:14px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;
  padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand em{font-style:normal;color:var(--accent)}
.brand small{display:block;font-weight:500;font-size:10px;color:var(--dim);letter-spacing:1.1px;text-transform:uppercase}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:8px;font-weight:600}
.tabs button.active{background:var(--accent);color:#08101f}
html[data-theme="light"] .tabs button.active{color:#fff}
.tabs .cnt{margin-left:7px;font-size:11px;opacity:.75}
.actions{display:flex;gap:6px;margin-left:auto}
.tbtn{border:1px solid var(--line);background:var(--panel);padding:7px 11px;border-radius:8px;font-size:12px;color:var(--muted)}
.tbtn:hover{border-color:var(--accent);color:var(--txt)}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;
  background:var(--bg2);border-right:1px solid var(--line);padding:16px 14px 40px}
.main{padding:22px 28px 90px;min-width:0;max-width:1500px}
.side-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:800;margin:2px 0 8px}
.stages{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:9px;margin-bottom:16px}
.stages button{flex:1;border:0;background:transparent;color:var(--muted);padding:6px 4px;border-radius:7px;font-size:11.5px;font-weight:700}
.stages button.active{background:var(--accent);color:#08101f}
html[data-theme="light"] .stages button.active{color:#fff}
.search-row{position:relative;margin-bottom:10px}
.search-row input{width:100%;padding:9px 30px 9px 32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);outline:none}
.search-row input:focus{border-color:var(--accent)}
.search-row .ico{position:absolute;left:10px;top:9px;color:var(--dim)}
.search-row .clr{position:absolute;right:6px;top:5px;border:0;background:transparent;color:var(--dim);font-size:17px;padding:2px 6px}
.star-toggle{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:7px;border-radius:8px;font-size:11.5px;font-weight:700;margin-bottom:16px;text-align:left}
.star-toggle.on{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.toc{border-top:1px solid var(--line);padding-top:12px}
.stage-h{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);
  margin:14px 0 6px;padding:5px 7px;background:var(--panel);border-radius:6px}
.toc-mod{margin-bottom:3px}
.toc-mod-h{display:flex;width:100%;align-items:center;gap:7px;border:0;background:transparent;color:var(--txt);
  font-weight:700;font-size:12px;padding:6px;border-radius:7px;text-align:left}
.toc-mod-h:hover{background:var(--panel)}
.toc-mod-h .chev{color:var(--dim);font-size:10px;transition:transform .15s}
.toc-mod.closed .chev{transform:rotate(-90deg)}
.toc-mod-h .n{margin-left:auto;color:var(--dim);font-size:10px;background:var(--panel);padding:1px 6px;border-radius:9px}
.toc-topics{padding:0 0 4px 12px}
.toc-mod.closed .toc-topics{display:none}
.toc-topics a{display:block;padding:4px 8px;font-size:11.5px;color:var(--muted);border-left:2px solid transparent;border-radius:0 6px 6px 0}
.toc-topics a:hover{background:var(--panel);color:var(--txt)}
.toc-topics a.active{border-left-color:var(--accent);color:var(--accent);background:var(--panel)}
.toc-topics a .c{color:var(--dim);font-size:10px;margin-right:5px}
.side-foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);line-height:1.8}
.side-foot b{color:var(--accent)}

.hero{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:16px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 4px;font-size:25px;letter-spacing:-.3px}
.hero h1 span{color:var(--accent)}
.hero .sub{color:var(--muted);font-size:13px;max-width:900px}
.hero .note{margin-top:10px;font-size:11.5px;color:var(--dim);border-left:2px solid var(--accent);padding-left:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:110px}
.stat b{display:block;font-size:19px;color:var(--accent);line-height:1.25}
.stat span{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:700}
.legend{margin-top:12px;font-size:11px;color:var(--muted)}
.legend .b{display:inline-block;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);font-size:10px;font-weight:700;margin-right:4px}
.result-bar{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:12px;color:var(--muted)}
.result-bar b{color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}

.stage-band{display:flex;align-items:center;gap:12px;margin:18px 0 12px;padding:9px 14px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.stage-band .lbl{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent)}
.stage-band .note{font-size:11px;color:var(--dim)}
.stage-band .n{margin-left:auto;font-size:11px;color:var(--muted)}
.mod{margin-bottom:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.mod-h{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mod-h .toggle{border:0;background:transparent;color:var(--dim);font-size:13px;padding:2px 4px}
.mod-h .code{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);
  background:var(--bg2);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
.mod-h h2{margin:0;font-size:16px;flex:1;min-width:180px}
.mod-h .meta{font-size:11px;color:var(--dim)}
.mod-body{padding:14px;display:grid;gap:12px}
.mod.closed .mod-body{display:none}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:78px}
.card.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
.card-head .num{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:10.5px;color:var(--accent);
  background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap;font-weight:700}
.card-head .htext{flex:1;min-width:0}
.card-head h3{margin:0;font-size:14.5px;line-height:1.4}
.card-head .crumb{font-size:10.5px;color:var(--dim);margin-top:2px}
.star{border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:15px;line-height:1;
  width:30px;height:30px;border-radius:8px}
.star.on{color:var(--warn);border-color:var(--warn)}
.card-grid{display:grid;grid-template-columns:1fr 1fr}
.fld{padding:11px 15px;border-bottom:1px solid var(--line)}
.fld:nth-child(odd){border-right:1px solid var(--line)}
.fld h4{margin:0 0 7px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:800}
.fld.warn h4{color:var(--warn)}
.fld ul{margin:0;padding-left:17px}
.fld li{margin:3px 0;font-size:12.2px}
.fld.formulas li{font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:13.6px;
  color:var(--accent2);line-height:1.85;letter-spacing:.2px}
.fld.formulas li sup,.fld.formulas li sub{font-size:.68em;line-height:0}
.fld.formulas li.hit{background:color-mix(in srgb,var(--warn) 15%,transparent);border-radius:6px}
.rad{border-top:1px solid currentColor;padding:0 3px;margin-left:1px}
.fld.warn li{color:var(--muted)}
mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.rel{padding:10px 15px;border-bottom:1px solid var(--line)}
.rel h4{margin:0 0 8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:10.5px;padding:4px 9px;border-radius:20px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip b{font-family:Consolas,monospace;color:var(--accent);font-size:10px;margin-right:5px}
.card-foot{padding:10px 15px;background:var(--panel)}
.card-foot label{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);font-weight:800}
.card-foot textarea{width:100%;margin-top:5px;padding:7px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg2);font-size:11.5px;outline:none;resize:vertical;min-height:46px;line-height:1.45}
.card-foot textarea:focus{border-color:var(--accent)}
.card-foot .tip{float:right;font-size:10px;color:var(--ok);text-transform:none;letter-spacing:0;font-weight:600}

@media(max-width:920px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;max-height:330px;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:18px 16px 70px}
  .card-grid{grid-template-columns:1fr}
  .fld:nth-child(odd){border-right:0}
  .actions{margin-left:0}
}
@media(max-width:620px){.hero h1{font-size:21px}.stats{gap:6px}.stat{min-width:88px}}
@media print{
  .topbar,.sidebar,.result-bar,.star{display:none!important}
  .layout{grid-template-columns:1fr}.main{padding:0}
  .mod.closed .mod-body{display:grid!important}
  body{background:#fff;color:#000}.card,.mod,.hero{break-inside:avoid;box-shadow:none}
}
</style>
</head>

    <div class="side-label">Contents</div>
    <nav class="toc" id="toc"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main">
    <section class="hero" id="hero"></section>
    <div class="result-bar" id="result-bar"></div>
    <div id="content"></div>
  </main>
</div>

                "Binding energy per nucleon and why fusion releases energy",

<script>
(function(){
"use strict";
var DATA=JSON.parse(document.getElementById('kb-data').textContent);
var LS='ib-kb-v2';
var state={board:'math',stage:'g9',theme:'dark',q:'',starOnly:false,star:{},notes:{},collapsed:{},tocClosed:{}};
try{
  var s=JSON.parse(localStorage.getItem(LS)||'null');
  if(s&&typeof s==='object'){
    state={board:s.board||'math',stage:s.stage||'g9',theme:s.theme||'dark',q:s.q||'',
      starOnly:!!s.starOnly,star:s.star||{},notes:s.notes||{},collapsed:s.collapsed||{},tocClosed:s.tocClosed||{}};
  }
}catch(e){}
var saveTimer=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,220);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function rx(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hl(s,q){
  var out=esc(s);
  if(!q)return out;
  try{return out.replace(new RegExp('('+rx(esc(q))+')','ig'),'<mark>$1</mark>');}catch(e){return out;}
}
/* ---------- lightweight maths typesetting (offline, no external library) ---------- */
var GREEK=[['infinity','∞'],['degrees','°'],['propto','∝'],['sqrt','√'],['PRODUCT','∏'],
  ['omega','ω'],['lambda','λ'],['theta','θ'],['Delta','Δ'],['delta','Δ'],
  ['gamma','γ'],['alpha','α'],['beta','β'],['phi','φ'],['rho','ρ'],
  ['sigma','σ'],['mu','μ'],['eta','η'],['tau','τ'],['hbar','ℏ'],
  ['pi','π'],['SUM','Σ'],['INT','∫']];
function words(t){
  GREEK.forEach(function(p){t=t.replace(new RegExp('\\b'+p[0]+'\\b','g'),p[1]);});
  return t;
}
function ops(t){
  return t.replace(/\+\/-\s*/g,'± ')
    .replace(/\+-/g,'± ')
    .replace(/<=>/g,'⇔').replace(/<->/g,'⇔')
    .replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/!=/g,'≠')
    .replace(/=>/g,'⇒').replace(/->/g,'→')
    .replace(/\.\.\./g,'…');
}
/* conservative cleanup for prose fields (still plain text, so search highlighting works) */
function symPlain(s){
  var t=words(ops(String(s==null?'':s)));
  t=t.replace(/\^2\b/g,'²').replace(/\^3\b/g,'³').replace(/\^\(-1\)/g,'⁻¹');
  t=t.replace(/\s°/g,'°');
  return t;
}
/* turn one plain formula chunk into safe display HTML */
function tok(t){
  t=ops(t);
  t=t.replace(/([0-9A-Za-z\)])\s+x\s+(?=[0-9A-Za-z\((])/g,'$1 × ');
  t=t.replace(/\(1\/2\)/g,'½').replace(/\(1\/3\)/g,'⅓');
  t=t.replace(/\b1\/2\b/g,'½').replace(/\b1\/3\b/g,'⅓')
     .replace(/\b2\/3\b/g,'⅔').replace(/\b1\/4\b/g,'¼').replace(/\b3\/4\b/g,'¾');
  t=t.replace(/\bis proportional to\b/g,'∝')
     .replace(/\bis approximately\b/g,'≈')
     .replace(/\bsubset\b/g,'⊂')
     .replace(/\bunion\b/g,'∪')
     .replace(/\bintersect\b/g,'∩')
     .replace(/\bcomplement\b/g,'ᶜ');
  t=t.replace(/\bnCk\b/g,'ⁿCₖ').replace(/\bnCr\b/g,'ⁿCᵣ').replace(/\bnPr\b/g,'ⁿPᵣ');
  t=words(t);
  t=t.replace(/Δ\s+(?=[A-Za-z])/g,'Δ');
  t=t.replace(/ - /g,' − ');
  t=t.replace(/(^|\s|\()-(?=[0-9A-Za-z])/g,'$1−');
  t=t.replace(/\s°/g,'°');
  t=t.replace(/'/g,'′');
  return esc(t);
}
function matchParen(s,i){
  if(s[i]!=='(')return -1;
  var d=0;
  for(var j=i;j<s.length;j++){
    if(s[j]==='(')d++;
    else if(s[j]===')'){d--;if(d===0)return j;}
  }
  return -1;
}
/* full renderer: √ with vinculum, <sup>, <sub>, operators and Greek letters */
function fmt(raw){
  var s=String(raw==null?'':raw)
    .replace(/\bdelta\s+x\b/g,'Δx')
    .replace(/\bSUM\s+x\s+(?=[A-Za-z(])/g,'Σ x·')
    .replace(/([0-9A-Za-z\)])\s+x\s+(?=[0-9A-Za-z\((])/g,'$1 × '),out='',buf='',i=0;
  function flush(){if(buf){out+=tok(buf);buf='';}}
  while(i<s.length){
    if(s.substr(i,5)==='sqrt('){
      var e=matchParen(s,i+4);
      if(e>0){flush();out+='√<span class="rad">'+fmt(s.slice(i+5,e))+'</span>';i=e+1;continue;}
    }
    if(s[i]==='^'||s[i]==='_'){
      var kind=s[i],inner='',tag=kind==='^'?'sup':'sub';
      if(s[i+1]==='('){
        var e2=matchParen(s,i+1);
        if(e2>0){inner=s.slice(i+2,e2);i=e2+1;}
        else{inner=s[i+1];i+=2;}
      }else{
        var mm=/^[-+]?[A-Za-z0-9]+/.exec(s.slice(i+1));
        if(mm){inner=mm[0];i+=1+mm[0].length;}
        else{inner=s[i+1]||'';i+=2;}
      }
      flush();out+='<'+tag+'>'+fmt(inner)+'</'+tag+'>';continue;
    }
    buf+=s[i];i++;
  }
  flush();return out;
}
var INDEX={};
function stageModules(board,stage){
  return DATA.boards[board].modules.filter(function(m){return stage==='all'||m.stage===stage;});
}
function flatten(board,stage,mods){
  var out=[];
  (mods||stageModules(board,stage)).forEach(function(m){
    m.topics.forEach(function(t){
      out.push(Object.assign({},t,{board:board,stage:m.stage,moduleId:m.id,moduleTitle:m.title,moduleCode:m.code}));
    });
  });
  return out;
}
function buildIndex(){
  INDEX={};
  ['math','physics'].forEach(function(b){
    flatten(b,'all').forEach(function(e){INDEX[e.id]=e;});
  });
}
function findEntry(id){return INDEX[id]||null;}
function stageLabel(id){
  var s=(DATA.boards[state.board].stages||[]).find(function(x){return x.id===id;});
  return s?s.label:(id==='g9'?'Grade 9 (MYP Year 4)':'DP (SL / HL)');
}
function stageNote(id){
  var s=(DATA.boards[state.board].stages||[]).find(function(x){return x.id===id;});
  return s?s.note:'';
}
function countFor(board){return flatten(board,'all').length;}
function matches(e){
  if(state.starOnly&&!state.star[e.id])return false;
  if(state.q){
    var hay=[e.id,e.code,e.title,e.moduleTitle,e.concepts.join(' '),e.formulas.join(' '),
      e.laws.join(' '),e.pitfalls.join(' '),e.links.join(' '),state.notes[e.id]||''].join(' ').toLowerCase();
    if(hay.indexOf(state.q.toLowerCase())<0)return false;
  }
  return true;
}
function field(title,arr,cls,q){
  var isF=cls==='formulas';
  return '<div class="fld '+(cls||'')+'"><h4>'+title+'</h4><ul>'+
    (arr&&arr.length?arr.map(function(x){
      if(isF){
        var hit=q&&x.toLowerCase().indexOf(q.toLowerCase())>=0;
        return '<li'+(hit?' class="hit"':'')+'>'+fmt(x)+'</li>';
      }
      return '<li>'+hl(symPlain(x),q)+'</li>';
    }).join(''):'<li>—</li>')+'</ul></div>';
}
function card(e,q){
  var links=(e.links||[]).map(function(id){
    var t=findEntry(id);
    return '<button class="chip" data-act="jump" data-id="'+esc(id)+'"><b>'+esc(id)+'</b>'+esc(t?t.title:'Unknown entry')+'</button>';
  }).join('')||'<span class="chip">No linked entries</span>';
  return '<article class="card" id="e-'+esc(e.id)+'" data-card="'+esc(e.id)+'">'+
    '<header class="card-head"><span class="num">'+hl(e.id,q)+'</span>'+
      '<div class="htext"><h3>'+hl(e.title,q)+'</h3>'+
        '<div class="crumb">'+esc(stageLabel(e.stage))+' &rsaquo; '+esc(e.moduleCode)+' &rsaquo; '+esc(e.moduleTitle)+' &rsaquo; '+hl(e.code,q)+' &middot; '+esc(e.level)+'</div></div>'+
      '<button class="star '+(state.star[e.id]?'on':'')+'" data-act="star" data-id="'+esc(e.id)+'" title="Star / unstar">'+(state.star[e.id]?'★':'☆')+'</button>'+
    '</header>'+
    '<div class="card-grid">'+
      field('Core concepts',e.concepts,'',q)+
      field('Formulas',e.formulas,'formulas',q)+
      field('Theorems, laws &amp; principles',e.laws,'',q)+
      field('Typical pitfalls',e.pitfalls,'warn',q)+
    '</div>'+
    '<div class="rel"><h4>Knowledge connections</h4><div class="chips">'+links+'</div></div>'+
    '<footer class="card-foot"><label>My notes <span class="tip">saved automatically</span>'+
      '<textarea data-act="notes" data-id="'+esc(e.id)+'" placeholder="Add a remark, example or question...">'+esc(state.notes[e.id]||'')+'</textarea></label></footer>'+
  '</article>';
}
function render(){
  buildIndex();
  document.body.dataset.board=state.board;
  document.documentElement.dataset.theme=state.theme;
  document.getElementById('btn-theme').textContent=state.theme==='dark'?'Light mode':'Dark mode';
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.board===state.board);});
  document.getElementById('cnt-math').textContent=countFor('math');
  document.getElementById('cnt-physics').textContent=countFor('physics');
  document.querySelectorAll('#stages button').forEach(function(b){b.classList.toggle('active',b.dataset.stage===state.stage);});
  var qs=document.getElementById('q');if(qs.value!==state.q)qs.value=state.q;
  document.getElementById('btn-star').classList.toggle('on',state.starOnly);
  document.getElementById('btn-star').innerHTML=(state.starOnly?'&#9733; Starred only':'&#9734; Starred only');
  var btnMods=stageModules(state.board,state.stage);
  var anyClosed=btnMods.some(function(m){return state.collapsed[state.board+':'+m.id];});
  document.getElementById('btn-expand').textContent=anyClosed?'Expand all':'Collapse all';

  var mods=stageModules(state.board,state.stage);
  var all=flatten(state.board,state.stage,mods);
  var shown=all.filter(matches);
  renderHero(all);
  renderToc(mods,shown);
  renderContent(mods,shown);
  document.getElementById('result-bar').innerHTML='Showing <b>'+shown.length+'</b> of '+all.length+' entries'+
    (state.q?' matching &ldquo;'+esc(state.q)+'&rdquo;':'')+
    ' <span style="margin-left:auto;color:var(--dim)">Click a connection to jump to that topic</span>';
  var starred=flatten(state.board,'all').filter(function(e){return state.star[e.id];}).length;
  var noted=flatten(state.board,'all').filter(function(e){return (state.notes[e.id]||'').trim();}).length;
  document.getElementById('side-foot').innerHTML='<b>'+starred+'</b> starred &middot; <b>'+noted+'</b> with notes<br>'+
    'Stars and notes are saved in this browser automatically.<br>Use the stage switch above to move between Grade 9 and DP.';
  save();
}
function renderHero(all){
  var b=DATA.boards[state.board];
  var g9=flatten(state.board,'g9').length, dp=flatten(state.board,'dp').length;
  var shownStage=state.stage==='all'?'Grade 9 + DP':stageLabel(state.stage);
  document.getElementById('hero').innerHTML=
    '<h1><span>'+esc(b.label)+'</span> &middot; Knowledge Base</h1>'+
    '<div class="sub">'+esc(b.subtitle)+'</div>'+
    '<div class="note">Now showing: <b>'+esc(shownStage)+'</b>. Basis: '+esc(DATA.meta.edition)+'. '+esc(DATA.meta.scope)+' Updated '+esc(DATA.meta.updated)+'.</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+(g9+dp)+'</b><span>Entries</span></div>'+
      '<div class="stat"><b>'+g9+'</b><span>Grade 9</span></div>'+
      '<div class="stat"><b>'+dp+'</b><span>DP</span></div>'+
    '</div>'+
    '<div class="legend">Every entry: core concepts &middot; formulas &middot; theorems &amp; laws &middot; typical pitfalls &middot; knowledge connections.</div>';
}
function renderToc(mods,shown){
  var grouped={};shown.forEach(function(e){(grouped[e.moduleId]=grouped[e.moduleId]||[]).push(e);});
  var h='',lastStage=null;
  mods.forEach(function(m){
    var list=grouped[m.id]||[];if(!list.length)return;
    if(m.stage!==lastStage){h+='<div class="stage-h">'+esc(stageLabel(m.stage))+'</div>';lastStage=m.stage;}
    var closed=state.tocClosed[state.board+':'+m.id]?' closed':'';
    h+='<div class="toc-mod'+closed+'" data-toc="'+esc(m.id)+'">'+
      '<button class="toc-mod-h" data-act="toc" data-mod="'+esc(m.id)+'"><span class="chev">&#9660;</span>'+
        esc(m.code)+' &middot; '+esc(m.title)+'<span class="n">'+list.length+'</span></button>'+
      '<div class="toc-topics">'+list.map(function(e){return '<a href="#e-'+esc(e.id)+'" data-toclink="'+esc(e.id)+'">'+
        '<span class="c">'+esc(e.code)+'</span>'+esc(e.title)+'</a>';}).join('')+'</div></div>';
  });
  document.getElementById('toc').innerHTML=h||'<div style="color:var(--dim);font-size:12px">No matching entries.</div>';
}
function renderContent(mods,shown){
  var grouped={};shown.forEach(function(e){(grouped[e.moduleId]=grouped[e.moduleId]||[]).push(e);});
  var stageCounts={};shown.forEach(function(e){stageCounts[e.stage]=(stageCounts[e.stage]||0)+1;});
  var h='',lastStage=null;
  mods.forEach(function(m){
    var list=grouped[m.id]||[];if(!list.length)return;
    if(m.stage!==lastStage){
      h+='<div class="stage-band"><span class="lbl">'+esc(stageLabel(m.stage))+'</span>'+
        '<span class="note">'+esc(stageNote(m.stage))+'</span>'+
        '<span class="n">'+(stageCounts[m.stage]||0)+' entries</span></div>';
      lastStage=m.stage;
    }
    var closed=state.collapsed[state.board+':'+m.id]?' closed':'';
    h+='<section class="mod'+closed+'" id="mod-'+esc(m.id)+'">'+
      '<header class="mod-h"><button class="toggle" data-act="collapse" data-mod="'+esc(m.id)+'">&#9660;</button>'+
        '<span class="code">'+esc(m.code)+'</span><h2>'+esc(m.title)+'</h2>'+
        '<span class="meta">'+list.length+' entries &middot; '+esc(m.hours)+'</span></header>'+
      '<div class="mod-body">'+list.map(function(e){return card(e,state.q);}).join('')+'</div></section>';
  });
  document.getElementById('content').innerHTML=h||'<div class="empty">Nothing matches. Try a different search term or switch the stage.</div>';
}

document.getElementById('q').addEventListener('input',function(){state.q=this.value;render();});
document.getElementById('q-clear').addEventListener('click',function(){state.q='';this.blur();render();document.getElementById('q').focus();});
document.getElementById('btn-star').addEventListener('click',function(){state.starOnly=!state.starOnly;render();});
document.getElementById('stages').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-stage]');if(!b)return;
  state.stage=b.dataset.stage;state.q='';state.starOnly=false;render();window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('tabs').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-board]');if(!b)return;
  state.board=b.dataset.board;state.q='';state.starOnly=false;render();window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('btn-expand').addEventListener('click',function(){
  var mods=stageModules(state.board,state.stage);
  var anyClosed=mods.some(function(m){return state.collapsed[state.board+':'+m.id];});
  mods.forEach(function(m){state.collapsed[state.board+':'+m.id]=!anyClosed;});
  render();
});
document.getElementById('btn-theme').addEventListener('click',function(){state.theme=state.theme==='dark'?'light':'dark';render();});
document.getElementById('btn-print').addEventListener('click',function(){window.print();});
document.getElementById('toc').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act="toc"]');if(!b)return;
  var k=state.board+':'+b.dataset.mod;state.tocClosed[k]=!state.tocClosed[k];render();
});
document.getElementById('content').addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var id=t.dataset.id;
  if(t.dataset.act==='star'){state.star[id]=!state.star[id];render();}
  else if(t.dataset.act==='jump'){jump(id);}
  else if(t.dataset.act==='collapse'){
    var k=state.board+':'+t.dataset.mod;state.collapsed[k]=!state.collapsed[k];render();
  }
});
document.getElementById('content').addEventListener('input',function(ev){
  var t=ev.target.closest('[data-act="notes"]');if(!t)return;
  state.notes[t.dataset.id]=t.value;saveSoon();
});
function jump(id){
  var e=findEntry(id);if(!e)return;
  state.board=e.board;state.stage=e.stage;state.q='';state.starOnly=false;
  state.collapsed[e.board+':'+e.moduleId]=false;
  render();
  setTimeout(function(){
    var el=document.getElementById('e-'+id);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1900);}
  },80);
}
document.addEventListener('keydown',function(ev){
  var tag=(ev.target.tagName||'').toLowerCase();
  if(ev.key==='/'&&tag!=='input'&&tag!=='textarea'){ev.preventDefault();document.getElementById('q').focus();}
  else if(ev.key==='Escape'&&document.activeElement===document.getElementById('q')){state.q='';render();}
});
var spyTimer=null;
window.addEventListener('scroll',function(){
  clearTimeout(spyTimer);
  spyTimer=setTimeout(function(){
    var cards=[].slice.call(document.querySelectorAll('.card'));
    if(!cards.length)return;
    var best=null,bestD=1e9;
    cards.forEach(function(c){var d=Math.abs(c.getBoundingClientRect().top-100);if(d<bestD){bestD=d;best=c;}});
    document.querySelectorAll('[data-toclink]').forEach(function(a){a.classList.toggle('active',!!best&&a.dataset.toclink===best.dataset.card);});
  },110);
},{passive:true});
render();
})();
</script>
